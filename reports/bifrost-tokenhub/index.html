html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f7f4ec;color:#272a2d;font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.loading{max-width:620px;margin:24px;padding:28px;border:1px solid #d7d4cc;border-radius:22px;background:#fffefa;box-shadow:0 10px 28px rgba(40,42,44,.07)}.dot{display:inline-block;width:.65em;height:.65em;margin-right:.55em;border:2px solid #3977b7;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#60666b}

<script>
(async()=>{
  if (!("DecompressionStream" in window)) throw new Error("当前浏览器过旧，不支持本页面的离线解压；请使用新版 Chrome、Safari、Edge 或 Firefox。");
  const b64=window.__REPORT_CHUNKS.join("");
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
})().catch(err=>{document.getElementById("status").textContent="报告载入失败："+err.message;console.error(err);});
</script>
