<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bifrost 与 TokenHub 深度对比报告</title>
<meta name="description" content="Bifrost 与 TokenHub 的架构、功能、路由、治理、成本、MCP、缓存和性能证据深度对比。">
<meta property="og:title" content="Bifrost 与 TokenHub 深度对比报告">
<meta property="og:description" content="架构图、功能矩阵、路由算法、治理与 FinOps、性能证据及选型建议。">
<meta property="og:type" content="article">
<meta property="og:url" content="https://legendtkl.github.io/reports/bifrost-tokenhub/">
<link rel="canonical" href="https://legendtkl.github.io/reports/bifrost-tokenhub/">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#f7f4ec;color:#272a2d;font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.card{max-width:680px;margin:24px;padding:28px;border:1px solid #d7d4cc;border-radius:22px;background:#fffefa;box-shadow:0 10px 28px rgba(40,42,44,.07)}
.dot{display:inline-block;width:.7em;height:.7em;margin-right:.55em;border:2px solid #3977b7;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
small{display:block;margin-top:8px;color:#60666b}
.error{color:#8d351b;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="card">
  <div id="status"><span class="dot"></span>正在载入完整报告…</div>
  <small>正在校验并解压报告数据。</small>
  <noscript><p class="error">请启用 JavaScript 后查看报告。</p></noscript>
</div>
<script>
(async()=>{
  const expectedChunkCount=5;
  const expectedBase64Length=37288;
  const expectedCompressedLength=27964;
  const expectedSha256='31c39f8f5763fc6f05296932dcb0318b831875a9521878dfa47f9fe3a7b9deaa';
  const version='29f424f';

  const chunks=[];
  for(let i=0;i<expectedChunkCount;i++){
    const name=`chunk-${String(i).padStart(2,'0')}.js`;
    const response=await fetch(`./${name}?v=${version}`,{cache:'no-store'});
    if(!response.ok) throw new Error(`${name} 请求失败：HTTP ${response.status}`);
    const text=await response.text();
    const match=text.match(/^window\.__REPORT_CHUNKS\.push\('([A-Za-z0-9+/=]+)'\);\s*$/);
    if(!match) throw new Error(`${name} 格式校验失败`);
    chunks.push(match[1]);
  }

  const base64=chunks.join('');
  if(base64.length!==expectedBase64Length){
    throw new Error(`Base64 长度异常：期望 ${expectedBase64Length}，实际 ${base64.length}`);
  }

  let binary;
  try{binary=atob(base64);}
  catch(error){throw new Error(`Base64 解码失败：${error.message}`);}

  const compressed=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) compressed[i]=binary.charCodeAt(i);
  if(compressed.length!==expectedCompressedLength){
    throw new Error(`压缩数据长度异常：期望 ${expectedCompressedLength}，实际 ${compressed.length}`);
  }
  if(compressed[0]!==0x1f||compressed[1]!==0x8b){
    throw new Error('报告压缩数据头校验失败');
  }

  if(globalThis.crypto?.subtle){
    const digest=await crypto.subtle.digest('SHA-256',compressed);
    const actual=[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('');
    if(actual!==expectedSha256) throw new Error('报告压缩数据哈希校验失败');
  }

  if(!('DecompressionStream' in window)){
    throw new Error('当前浏览器不支持 gzip 解压，请使用新版 Chrome、Safari、Edge 或 Firefox。');
  }
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.toLowerCase().includes('<!doctype html')||
     !html.includes('Bifrost')||
     !html.includes('TokenHub')){
    throw new Error('报告正文完整性校验失败');
  }

  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  const status=document.getElementById('status');
  status.className='error';
  status.textContent='报告载入失败：'+error.message;
  console.error(error);
});
</script>
</body>
</html>
