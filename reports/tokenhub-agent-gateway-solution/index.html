<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TokenHub Agent Gateway：A2A 1.0 生产级最终技术方案</title>
  <meta name="description" content="TokenHub Agent Gateway 生产级最终技术方案：Task-first、Execution-scoped、Capability-delegated、Event-sourced、Ledger-accounted。">
  <link rel="canonical" href="https://legendtkl.github.io/reports/tokenhub-agent-gateway-solution/">
  <meta property="og:type" content="article">
  <meta property="og:title" content="TokenHub Agent Gateway：A2A 1.0 生产级最终技术方案">
  <meta property="og:description" content="统一 A2A、Responses、身份委托、任务状态、实例路由、预算治理和可观测性。">
  <meta property="og:url" content="https://legendtkl.github.io/reports/tokenhub-agent-gateway-solution/">
  <meta property="og:image" content="https://legendtkl.github.io/reports/tokenhub-agent-gateway-solution/cover.svg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#f5f7fb;color:#13213c;font:16px/1.65 Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
    .card{width:min(650px,calc(100% - 32px));padding:30px;border:1px solid #dce3ee;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(18,35,68,.12)}
    .mark{display:grid;place-items:center;width:44px;height:44px;margin-bottom:17px;border-radius:13px;background:linear-gradient(135deg,#355edb,#7a55da);color:#fff;font-size:12px;font-weight:800}
    .title{font-weight:850;font-size:25px;line-height:1.25;margin-bottom:10px}.sub{color:#5d6b82}.dot{display:inline-block;width:.75em;height:.75em;margin-right:.65em;border:2px solid #3b5ccc;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.error{color:#be3443;white-space:pre-wrap;word-break:break-word}
    @media(prefers-color-scheme:dark){body{background:#080d1a;color:#eaf0ff}.card{background:#0f1728;border-color:#26344f}.sub{color:#aebbd1}}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">A2A</div>
    <div class="title">TokenHub Agent Gateway<br>生产级最终技术方案</div>
    <div id="status"><span class="dot"></span>正在载入完整方案…</div>
    <div class="sub">正在校验并解压独立静态报告。</div>
    <noscript><p class="error">请启用 JavaScript 后查看报告。</p></noscript>
  </div>
  <script>
    (async()=>{
      const expectedBase64Length=25028;
      const expectedCompressedLength=18770;
      const expectedSha256='9335240b9bda728122138148900c9f593cfde37df71fd27de87a8106aa30a2d3';
      const chunks=[];
      for(let i=0;i<5;i++){
        const name=`chunk-${String(i).padStart(2,'0')}.txt`;
        const response=await fetch(`./${name}?v=20260820-v1`,{cache:'no-store'});
        if(!response.ok) throw new Error(`${name} 请求失败：HTTP ${response.status}`);
        chunks.push((await response.text()).trim());
      }
      const base64=chunks.join('');
      if(base64.length!==expectedBase64Length) throw new Error(`方案数据长度异常：${base64.length}`);
      let binary;try{binary=atob(base64)}catch(error){throw new Error(`Base64 解码失败：${error.message}`)}
      const compressed=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)compressed[i]=binary.charCodeAt(i);
      if(compressed.length!==expectedCompressedLength||compressed[0]!==0x1f||compressed[1]!==0x8b)throw new Error('方案压缩数据校验失败');
      if(globalThis.crypto?.subtle){const digest=await crypto.subtle.digest('SHA-256',compressed);const actual=[...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('');if(actual!==expectedSha256)throw new Error('方案数据哈希校验失败')}
      if(!('DecompressionStream'in window))throw new Error('当前浏览器不支持 gzip 解压，请使用新版 Chrome、Safari、Edge 或 Firefox。');
      const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      if(!html.toLowerCase().includes('<!doctype html')||!html.includes('TokenHub Agent Gateway')||!html.includes('Usage Ledger'))throw new Error('方案正文完整性校验失败');
      document.open();document.write(html);document.close();
    })().catch(error=>{const el=document.getElementById('status');el.className='error';el.textContent='方案载入失败：'+error.message+'\n请尝试强制刷新页面。';console.error(error)});
  </script>
</body>
</html>
