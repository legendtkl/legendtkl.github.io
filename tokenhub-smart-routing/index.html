<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#5b5cf0" />
  <title>TokenHub 智能模型路由技术方案</title>
  <meta name="description" content="参考 Switchyard、RouteLLM、OpenRouter、Not Diamond 与 Portkey，为 TokenHub 设计可灰度、可回滚、可评测的智能模型路由能力。" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="TokenHub 智能模型路由技术方案" />
  <meta property="og:description" content="十三张流程、架构、时序与评测图，系统说明 TokenHub 智能模型路由方案。" />
  <meta property="og:url" content="https://legendtkl.github.io/tokenhub-smart-routing/" />
  <meta name="twitter:card" content="summary" />
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;color:#111827;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot-card{width:min(520px,100%);padding:30px;border:1px solid #dfe5ef;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(30,41,59,.09);text-align:center}.boot-mark{width:48px;height:48px;margin:0 auto 18px;border-radius:15px;background:linear-gradient(135deg,#5b5cf0,#0ea5e9);animation:pulse 1.3s ease-in-out infinite alternate}.boot h1{margin:0 0 8px;font-size:22px}.boot p{margin:0;color:#5f6b7a;line-height:1.7}.boot-error{color:#dc3f4b}@keyframes pulse{to{transform:scale(.88);opacity:.7}}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div class="boot-card"><div class="boot-mark"></div><h1>正在加载技术方案</h1><p>初始化架构图、时序图与评测图…</p></div></div>
  <div id="app"></div>
  <script>
    const decodeGzipBase64 = async (url) => {
      if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持 DecompressionStream，请使用最新版 Chrome、Edge、Safari 或 Firefox。');
      const encoded = (await fetch(url, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.text(); })).trim();
      const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    };
    (async () => {
      try {
        const [css, ...parts] = await Promise.all([
          decodeGzipBase64('assets/styles.css.gz.b64'),
          decodeGzipBase64('assets/body-1.html.gz.b64'),
          decodeGzipBase64('assets/body-2.html.gz.b64'),
          decodeGzipBase64('assets/body-3.html.gz.b64')
        ]);
        const style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
        document.getElementById('app').innerHTML = parts.join('');
        document.getElementById('boot').remove();
        const script = document.createElement('script');
        script.src = 'assets/app.js';
        script.defer = true;
        document.body.appendChild(script);
      } catch (error) {
        document.querySelector('#boot .boot-card').innerHTML = `<h1 class="boot-error">页面加载失败</h1><p>${String(error.message || error)}</p><p style="margin-top:14px"><a href="https://github.com/legendtkl/legendtkl.github.io/tree/master/tokenhub-smart-routing">查看 GitHub 源文件</a></p>`;
      }
    })();
  </script>
</body>
</html>
